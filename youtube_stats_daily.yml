name: Daily YouTube Stats Sync

on:
  schedule:
    # Runs every day at 06:00 UTC
    - cron: "0 6 * * *"
  # Allows manual test runs from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-youtube-stats:
    runs-on: ubuntu-latest

    env:
      SHEET_ID: "1E_hHIR4E7S4F777U__gNjegVCJ0b2wSGpil7VUae0Qo"
      # Set YOUTUBE_CHANNEL as a Repository Variable (Settings -> Secrets and variables -> Actions -> Variables)
      # Example: @GoogleDevelopers or UC_x5XG1OV2P6uZZ5FSM9Ttw
      CHANNEL: ${{ vars.YOUTUBE_CHANNEL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir gspread

      - name: Write Google Service Account key
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "Error: GOOGLE_SERVICE_ACCOUNT_JSON secret is not set." >&2
            exit 1
          fi
          printf '%s' "$SA_JSON" > service_account.json

      - name: Push latest video stats and channel overview to Google Sheets
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$CHANNEL" ]; then
            echo "Error: YOUTUBE_CHANNEL repository variable is not set." >&2
            exit 1
          fi

          # 1. Push latest 10 uploads to the default 'YouTube Stats' tab
          python3 youtube_stats.py channel "$CHANNEL" \
            --recent 10 \
            --sheet-id "$SHEET_ID" \
            --worksheet "YouTube Stats" \
            --service-account service_account.json

          # 2. Push channel-level snapshot to 'Channel Overview' tab
          python3 youtube_stats.py channel "$CHANNEL" \
            --sheet-id "$SHEET_ID" \
            --worksheet "Channel Overview" \
            --service-account service_account.json

      - name: Clean up credentials
        if: always()
        run: rm -f service_account.json
